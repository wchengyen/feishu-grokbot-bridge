; Alternative to systemd. Run exactly one process.
; Secrets stay in .env, which deploy/run.sh lets the app read. Do not put the
; sender key or app secret in this file.

[supervisord]
nodaemon=false

[program:feishu-grokbot-bridge]
command=/opt/feishu-grokbot-bridge/deploy/run.sh
directory=/opt/feishu-grokbot-bridge
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=20
stopsignal=TERM
stdout_logfile=/var/log/feishu-grokbot-bridge.log
stderr_logfile=/var/log/feishu-grokbot-bridge.err.log
priority=10
numprocs=1
